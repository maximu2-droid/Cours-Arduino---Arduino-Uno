; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
# 1. On indique le dossier qui contient vos cours
src_dir = src

# 2. Vos lignes d'origine Arduino (Conservez EXACTEMENT ce que vous aviez déjà)
[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps = arduino-libraries/Servo @ ^1.2.2

# 3. On ajoute la liste de vos exercices en dessous
[env:Variables]
build_src_filter = +<Variables.cpp>
[env:Fonctions]
build_src_filter = +<Fonctions.cpp>
[env:Structures]
build_src_filter = +<Structures.cpp>
[env:TerminalSerie]
build_src_filter = +<TerminalSerie.cpp>
[env:Exercices]
build_src_filter = +<Exercices.cpp>
